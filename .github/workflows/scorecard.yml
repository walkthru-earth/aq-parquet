# OpenSSF Scorecard of the repository supply chain, weekly and on main (#45).
#
# It reads the repository and its settings with the workflow token and uploads
# the SARIF result to code scanning, which a public repository has without any
# setting. Results are not published to the Scorecard API, so the job needs no
# OIDC token. It never runs on pull requests, so it is not part of the
# `CI result` check in ci.yml and never blocks a merge.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Mondays 04:17 UTC, off the hour to avoid the scheduler peak.
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Upload the SARIF result to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
