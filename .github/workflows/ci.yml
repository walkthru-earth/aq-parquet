# Host gate and pinned ESP-IDF board builds for every pull request and main.
#
# The host job runs `pixi run gate`, the same entry point developers run, so
# CI and local checks cannot drift. Tasks that need a board, serial port,
# Bluetooth or a LAN peer stay manual and dated in each board bench record.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual rerun of the full workflow on any branch, for example to refresh
  # the main size baseline. Add merge_group here if a merge queue is enabled.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint the workflows themselves. actionlint checks syntax, expressions and
  # embedded shell with shellcheck. zizmor audits for template injection,
  # credential persistence, unpinned actions and excessive permissions. It is
  # cheap, so it runs on every event and needs no path filter.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the pixi binary is needed. The linters come from exact conda-forge
      # pins through pixi exec, so local runs use the same versions.
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: actionlint
        run: pixi exec -s actionlint==1.7.12 -s shellcheck==0.11.0 -- actionlint -color
      - name: zizmor
        env:
          # Online audits look up known vulnerable and impostor action commits.
          GH_TOKEN: ${{ github.token }}
        run: pixi exec -s zizmor==1.31.1 -- zizmor --format=github .github

  host-gate:
    name: Host gate
    runs-on: ubuntu-24.04
    # Each gate task has its own 300 s bound in tools/gate.sh, so this only
    # catches a stall outside the gate.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Show pinned host tool versions
        run: |
          pixi run clang++ --version
          pixi run clang-format --version
          pixi run cppcheck --version
      - name: Run host gate
        timeout-minutes: 20
        run: pixi run gate --keep-going

  board-build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Observed legs take about 4 min with no SDK cache (every pull request
    # until main writes one), so 25 min leaves room for a slow mirror.
    timeout-minutes: 25
    permissions:
      contents: read
      # Read a main run's size artifact for the delta summary.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cores3
            task: cores3-build
            project: firmware/esp-idf-cores3
            variant: bringup
          - name: waveshare-logger
            task: waveshare-build logger
            project: firmware/esp-idf-waveshare-sim7670g
            variant: logger
          # Retained PMS5003T/TF bench image. It shares the board components,
          # so a component change must keep it compiling too.
          - name: waveshare-diagnostic
            task: waveshare-build diagnostic
            project: firmware/esp-idf-waveshare-sim7670g
            variant: diagnostic
          # Generic component fixtures. They prove the shared components build
          # without Arduino or M5 dependencies and have no image to size.
          - name: component-fixtures
            task: connectivity-build-test
            extra_task: logger-build-test
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Read pinned ESP-IDF identity
        id: idf
        run: |
          source tools/idf-dependencies.lock
          echo "version=${ESP_IDF_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${ESP_IDF_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
      # The SDK comes from the repo's own `pixi run idf-setup`, not the
      # espressif/idf container. setup-idf.sh clones the pinned tag, refuses any
      # checkout whose HEAD differs from ESP_IDF_COMMIT, verifies submodules with
      # check_idf_target.py and installs the esp32s3 tools with Pixi's Python.
      # That is the exact identity and code path developers use. A container
      # tag can move, carries its own Python and tool set, and would bypass
      # these checks. The cache only skips downloads, setup-idf.sh still runs
      # and re-verifies the commit on every job.
      #
      # Caches are restored on every run but written only by pushes to main.
      # Pull request scoped entries cannot be restored by main or by other
      # pull requests, so writing them would only evict the main entries from
      # the 10 GB repository quota.
      - name: Restore ESP-IDF SDK and tools
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/m5stack-aq-parquet/toolchains/esp-idf-v${{ steps.idf.outputs.version }}
            ~/.espressif
            !~/.espressif/dist
          key: esp-idf-${{ runner.os }}-${{ steps.idf.outputs.commit }}-${{ hashFiles('tools/setup-idf.sh', 'pixi.lock') }}
      - name: Install pinned ESP-IDF
        run: pixi run idf-setup
      # Every leg installs the same SDK, so one leg saves it.
      - name: Save ESP-IDF SDK and tools
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && matrix.name == 'cores3' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/m5stack-aq-parquet/toolchains/esp-idf-v${{ steps.idf.outputs.version }}
            ~/.espressif
            !~/.espressif/dist
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ steps.idf.outputs.commit }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ steps.idf.outputs.commit }}-
      - name: Build
        env:
          TASK: ${{ matrix.task }}
          EXTRA_TASK: ${{ matrix.extra_task }}
        run: |
          read -r -a task <<<"${TASK}"
          pixi run "${task[@]}"
          if [[ -n "${EXTRA_TASK}" ]]; then
            pixi run "${EXTRA_TASK}"
          fi
      - name: ccache statistics
        if: always()
        run: pixi run ccache --show-stats
      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ steps.idf.outputs.commit }}-${{ github.sha }}
      - name: Measure image size
        if: matrix.project
        env:
          PROJECT: ${{ matrix.project }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p size
          pixi run idf -C "${PROJECT}" -B "${PROJECT}/build/${VARIANT}" \
            size --format json2 --output-file "${PWD}/size/size.json"
          cp "${PROJECT}/build/${VARIANT}/aq-build-sha256.json" size/
      - name: Fetch size baseline
        id: baseline
        if: matrix.project
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          # Empty outside pull requests.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The delta is optional, so an API error must not fail a green build.
          # Pushes and manual runs both count. Filtering on the event keeps out
          # a fork pull request whose head branch is also named main.
          events='map(select(.event == "push" or .event == "workflow_dispatch"))'
          run_id="" sha="" from=""
          # Prefer the run for the commit this pull request is based on, so the
          # delta shows only this change. Fall back to the newest green main run.
          if [[ -n "${BASE_SHA}" ]]; then
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
              --commit "${BASE_SHA}" --status success --limit 20 --json databaseId,event \
              --jq "${events} | .[0].databaseId // empty" || true)"
            from="pull request base ${BASE_SHA:0:12}"
            if [[ -z "${run_id}" ]]; then
              echo "No green run for the pull request base ${BASE_SHA:0:12}"
            fi
          fi
          if [[ -z "${run_id}" ]]; then
            read -r run_id sha < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
              --branch main --status success --limit 20 --json databaseId,event,headSha \
              --jq "${events} | .[0] // empty | \"\\(.databaseId) \\(.headSha)\"" || true) || true
            from="newest green main build ${sha:0:12}"
          fi
          if [[ -n "${run_id}" ]] && gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              --name "size-${NAME}" --dir baseline; then
            echo "Size baseline is the ${from}, run ${run_id}"
            echo "from=${from}, run ${run_id}" >> "$GITHUB_OUTPUT"
          else
            echo "No size baseline available"
          fi
      - name: Write size summary
        if: matrix.project
        env:
          NAME: ${{ matrix.name }}
          VARIANT: ${{ matrix.variant }}
          BASELINE_FROM: ${{ steps.baseline.outputs.from }}
        run: |
          baseline=()
          if [[ -f baseline/size.json ]]; then
            baseline=(--baseline baseline/size.json --baseline-from "${BASELINE_FROM}")
          fi
          pixi run python tools/size_report.py --label "${NAME} (${VARIANT})" \
            size/size.json ${baseline[@]+"${baseline[@]}"} >> "$GITHUB_STEP_SUMMARY"
      - name: Upload size report
        if: matrix.project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-${{ matrix.name }}
          path: size/
          if-no-files-found: error
          # Main builds are size baselines for later pull requests.
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
      # The ELF and map decode a crash backtrace or explain a size change, and
      # flash_args records the offsets of the image that was built. Provisioning
      # data and owner secrets live in NVS on the device, never in the build.
      - name: Upload firmware symbols
        if: matrix.project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/${{ matrix.variant }}/*.elf
            ${{ matrix.project }}/build/${{ matrix.variant }}/*.map
            ${{ matrix.project }}/build/${{ matrix.variant }}/flash_args
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  # The one required status check. It fails unless every job above passed,
  # so adding, renaming or splitting a job never needs a ruleset change. A
  # cancelled or timed out job counts as a failure. A skipped job also fails
  # unless it is named in ALLOWED_SKIPS. None of the jobs above has an `if:` or
  # a `needs`, so none can skip today and the list is empty. A job that gains
  # an `if:` must be added here on purpose, or its skip blocks the merge.
  ci-result:
    name: CI result
    if: always()
    needs: [workflow-lint, host-gate, board-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Job ids that may report skipped, separated by any whitespace.
          ALLOWED_SKIPS: ""
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"${NEEDS}"
          # Print every job that blocks, then fail if there is one. An empty
          # needs object or an allowed name that is not a job also blocks.
          blocked="$(jq -r --arg allowed "${ALLOWED_SKIPS}" '
            . as $needs
            | ([$allowed | splits("\\s+")] | map(select(. != ""))) as $skip
            | (if length == 0 then "no job results" else empty end),
              ($skip[] | select(. as $k | $needs | has($k) | not)
                | "ALLOWED_SKIPS names \(.), which is not in needs"),
              (to_entries[]
                | select(.value.result != "success")
                | select(.value.result != "skipped" or (.key as $k | any($skip[]; . == $k) | not))
                | "\(.key) blocks with result \(.value.result)")
          ' <<<"${NEEDS}")"
          if [[ -n "${blocked}" ]]; then
            echo "${blocked}"
            exit 1
          fi
