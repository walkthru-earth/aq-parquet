[workspace]
authors = ["Youssef Harby <yharby@walkthru.earth>"]
channels = ["conda-forge"]
name = "aq-parquet"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# --- device safety, read-only unless named otherwise ---
# Which serial ports exist. Run before anything that touches the board.
ports = "python -m serial.tools.list_ports -v"
# Confirm you are talking to an ESP32-S3 and not another board. Read-only.
chip = "tools/esptool-read.sh chip-id"
flash-id = "tools/esptool-read.sh flash-id"
mac = "tools/esptool-read.sh read-mac"
# Read-only eFuse dump. Confirms flash type, wafer revision and that no
# secure-boot or flash-encryption fuse has been burned.
efuse = "tools/espefuse-summary.sh"
# Full 16 MB flash image before the first write. This is the anti-brick step.
# Do NOT add a high --baud here. Measured on CoreS3 over USB-Serial/JTAG, the
# esptool default read the whole 16 MB in 97 s, while --baud 921600 aborted
# partway with "Serial data stream stopped, possible serial noise or corruption".
backup = "tools/backup-flash.sh"
backup-test = "python tools/test_backup_flash.py"
# Restore a backup taken above. Destructive, pass the file explicitly.
restore = "tools/restore-flash.sh"
# Show the partition table of a saved backup image. Read-only, pass the file.
backup-partitions = "python tools/read_partitions.py"
# Read the board's serial output for a bounded time, then stop. Never writes
# to flash. Pass --port and --seconds, see the script for the full options.
capture = "python tools/capture_serial.py"
# Interactive serial terminal. Pass the port and baud, for example
# pixi run monitor /dev/cu.usbmodem101 115200
monitor = "python -m serial.tools.miniterm --raw"
parquet-device = "python tools/parquet_device.py"
# Bluetooth LE client for docs/shared/ble-sync-protocol.md; bench tool for the phone contract.
ble-sync = "python tools/ble_sync.py"
parquet-test = "python tools/test_parquet.py"
pms-frame-test = "clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tools/test_pms_frame.cpp firmware/common/src/pms_frame.cpp -o /tmp/aq-pms-frame-test && /tmp/aq-pms-frame-test"
telemetry-contract-test = "python tools/test_telemetry_contract.py"

# --- existing CoreS3 firmware trial: Arduino ESP32 + M5Unified ---
arduino-setup = "firmware/arduino-m5unified/setup.sh"
arduino-boards = "firmware/arduino-m5unified/arduino-cli.sh board listall m5stack_cores3"
arduino-build = "firmware/arduino-m5unified/build.sh"
# Destructive: pass the explicit checked port, e.g. pixi run arduino-flash /dev/cu.usbmodem101
arduino-flash = "firmware/arduino-m5unified/flash.sh"

# --- Waveshare V2 logger and retained PMS5003T/TF diagnostic ---
waveshare-setup = "firmware/arduino-waveshare-sim7670g/setup.sh"
waveshare-build = "firmware/arduino-waveshare-sim7670g/build.sh"
waveshare-diagnostic-build = "firmware/arduino-waveshare-sim7670g/build.sh diagnostic"
waveshare-contract-test = "python tools/test_waveshare_contract.py"
logger-build-test = "bash tools/test_logger_build.sh"
owner-pin = "python tools/owner_pin.py"
provision-usb = "python tools/provision_usb.py"
logger-status-test = "python tools/test_logger_status.py --sanitize"
logger-provision-test = "python tools/test_logger_provision.py --sanitize"
# Destructive: requires the checked port and exact full-backup file.
waveshare-flash = "firmware/arduino-waveshare-sim7670g/flash.sh"

# --- host code quality ---
fmt = "rg --files -0 firmware tools -g '*.c' -g '*.h' -g '*.cpp' -g '*.hpp' -g '*.ino' -g '!**/vendor/**' -g '!**/build/**' | xargs -0 clang-format -i"
fmt-check = "rg --files -0 firmware tools -g '*.c' -g '*.h' -g '*.cpp' -g '*.hpp' -g '*.ino' -g '!**/vendor/**' -g '!**/build/**' | xargs -0 clang-format --dry-run --Werror"
lint = "bash tools/lint.sh"
archive-sync-test = "python tools/test_archive_sync.py --sanitize"
control-sync-test = "python tools/test_control_sync.py --sanitize"
config-test = "python tools/test_device_config.py --sanitize"
common-test = "python tools/test_common.py --sanitize"
ltr553-test = "python tools/test_ltr553.py --sanitize"
connectivity-build-test = "tools/build_connectivity_fixture.sh"
compression-bench = "python tools/benchmark_compression.py"
hooks = "pre-commit install"

[dependencies]
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
ccache = ">=4.14,<5"
python = ">=3.14.7,<3.15"
git = ">=2.55.0,<3"
esptool = ">=5.3.1,<6"
rust = ">=1.98.0,<1.99"
clang-tools = ">=23.1.0,<24"
pip = ">=26.2.1,<27"
pyserial = ">=3.5,<4"
cppcheck = ">=2.21.0,<3"
pre-commit = ">=4.6.2,<5"
pyarrow = ">=25.0.0,<26"
duckdb = ">=1.5.5,<2"

[activation.env]
# Firmware SDKs are large and are not conda packages, so the project bootstraps
# them itself into one pinned cache that every git worktree shares. Override
# this to relocate them. Nothing here is ever written inside the repo.
AQ_TOOLCHAIN_ROOT = "$HOME/.cache/m5stack-aq-parquet/toolchains"
# Legacy override remains accepted by both trial scripts.
M5_TOOLCHAIN_ROOT = "$HOME/.cache/m5stack-aq-parquet/toolchains"
# macOS system zoneinfo remains valid if a Pixi environment is moved with a
# worktree; Python's compiled default path can still point at its old location.
PYTHONTZPATH = "/usr/share/zoneinfo"

[pypi-dependencies]
bleak = ">=3.0.2, <4"
