[workspace]
authors = ["Youssef Harby <yharby@walkthru.earth>"]
channels = ["conda-forge"]
name = "aq-parquet"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# --- device safety, read-only unless named otherwise ---
# Which serial ports exist. Run before anything that touches the board.
ports = "python -m serial.tools.list_ports -v"
# Confirm you are talking to an ESP32-S3 and not another board. Read-only.
chip = "tools/esptool-read.sh chip-id"
flash-id = "tools/esptool-read.sh flash-id"
mac = "tools/esptool-read.sh read-mac"
# Read-only eFuse dump. Confirms flash type, wafer revision and that no
# secure-boot or flash-encryption fuse has been burned.
efuse = "tools/espefuse-summary.sh"
# Full 16 MB flash image before the first write. This is the anti-brick step.
# Do NOT add a high --baud here. Measured on CoreS3 over USB-Serial/JTAG, the
# esptool default read the whole 16 MB in 97 s, while --baud 921600 aborted
# partway with "Serial data stream stopped, possible serial noise or corruption".
backup = "tools/backup-flash.sh"
backup-test = "python tools/test_backup_flash.py"
# Restore a backup taken above. Destructive, pass the file explicitly.
restore = "tools/restore-flash.sh"
# Show the partition table of a saved backup image. Read-only, pass the file.
backup-partitions = "python tools/read_partitions.py"
# Read the board's serial output for a bounded time, then stop. Never writes
# to flash. Pass --port and --seconds, see the script for the full options.
capture = "python tools/capture_serial.py"
# Send on cue over one port open, with a fake port.
capture-serial-test = "python tools/test_capture_serial.py"
# Interactive serial terminal. Pass the port and baud, for example
# pixi run monitor /dev/cu.usbmodem101 115200
monitor = "python -m serial.tools.miniterm --raw"
parquet-device = "python tools/parquet_device.py"
# Bluetooth LE client for docs/shared/ble-sync-protocol.md; bench tool for the phone contract.
ble-sync = "python tools/ble_sync.py"
ble-sync-test = "python tools/test_ble_sync.py"
parquet-test = "python tools/test_parquet.py"
# Footer reader and Iceberg DataFile metrics: PyArrow/DuckDB cross-check, crafted footers, fuzz loop.
reader-test = "python tools/test_parquet_reader.py --sanitize"
# Power cut cycles at the write, footer and rename stages with a per boot loss account (owner bench, #61 item 2).
bench-power-cut = "python tools/bench_power_cut.py"
bench-power-cut-test = "python tools/test_bench_power_cut.py"
# Battery discharge curve plot and per boot power-critical close and small file count (owner bench, #61 item 1).
analyze-discharge = "python tools/analyze_discharge.py"
analyze-discharge-test = "python tools/test_analyze_discharge.py"
# Rebuild a footer for a quarantined .partial from its page headers, see docs/shared/telemetry-pipeline.md.
rebuild-partial = "python tools/rebuild_partial.py"
rebuild-partial-test = "python tools/test_rebuild_partial.py"
# Device file sizes, footers and host encoding/compaction variants, see docs/shared/parquet-small-files.md.
size-survey = "python tools/parquet_size_survey.py"
size-survey-test = "python tools/test_parquet_size_survey.py"
# CI image size table, falls back to absolute sizes on a malformed baseline (#45).
size-report-test = "python tools/test_size_report.py"
# Fail closed when an app image uses more than its share of the smallest app slot (#45).
ota-slot-check = "python tools/ota_slot_check.py"
ota-slot-check-test = "python tools/test_ota_slot_check.py"
# Sign app images with the owner's local key in secrets/, never in CI (#45).
# See docs/shared/development.md#local-app-signing.
release-sign = "python tools/release_sign.py"
release-sign-test = "python tools/test_release_sign.py"
# Safety rules of the tag release workflow, proved by mutation (#45).
release-workflow-test = "python tools/test_release_workflow.py"
# Nothing under secrets/ and no PEM private key tracked by git. lint runs it.
secrets-check = "python tools/check_secrets.py"
secrets-check-test = "python tools/test_check_secrets.py"
stack-budget = "python tools/stack_budget.py"
stack-budget-test = "python tools/test_stack_budget.py"
# No board, modem or chip target name in a firmware/common preprocessor conditional (#37).
board-conditionals-test = "python tools/test_board_conditionals.py"
pms-frame-test = "clang++ -std=c++23 -Wall -Wextra -Werror -fsanitize=address,undefined tools/test_pms_frame.cpp firmware/common/sensors/src/pms_frame.cpp -o /tmp/aq-pms-frame-test && /tmp/aq-pms-frame-test"
telemetry-contract-test = "python tools/test_telemetry_contract.py"

# --- native ESP-IDF: one pinned SDK, independent board applications ---
idf-setup = "tools/setup-idf.sh"
idf = "tools/idf.sh"
cores3-setup = "firmware/esp-idf-cores3/setup.sh"
cores3-build = "firmware/esp-idf-cores3/build.sh"
# Destructive: requires checked port and exact 16 MiB board backup.
cores3-flash = "firmware/esp-idf-cores3/flash.sh"

# --- Waveshare V2 logger and retained PMS5003T/TF diagnostic ---
waveshare-setup = "firmware/esp-idf-waveshare-sim7670g/setup.sh"
waveshare-build = "firmware/esp-idf-waveshare-sim7670g/build.sh"
waveshare-diagnostic-build = "firmware/esp-idf-waveshare-sim7670g/build.sh diagnostic"
waveshare-contract-test = "python tools/test_waveshare_contract.py"
logger-build-test = "bash tools/test_logger_build.sh"
logger-work-queue-test = "python tools/test_logger_work_queue.py"
logger-watchdog-test = "python tools/test_logger_watchdog.py --sanitize"
# Bench only parquet bench-stall parser, deadline and default-off guard (#49).
logger-bench-stall-test = "python tools/test_logger_bench_stall.py --sanitize"
logger-codec-store-test = "python tools/test_logger_codec_store.py --sanitize"
debug-log-test = "python tools/test_debug_log.py"
owner-pin = "python tools/owner_pin.py"
provision-usb = "python tools/provision_usb.py"
logger-status-test = "python tools/test_logger_status.py --sanitize"
logger-rotation-test = "python tools/test_logger_rotation.py"
logger-directory-test = "python tools/test_logger_directory.py --sanitize"
logger-list-since-test = "python tools/test_logger_list_since.py --sanitize"
storage-governor-test = "python tools/test_storage_governor.py --sanitize"
crc-cache-test = "python tools/test_crc_cache.py --sanitize"
sd-transfer-buffer-test = "python tools/test_sd_transfer_buffer.py --sanitize"
logger-archive-reset-test = "python tools/test_logger_archive_reset.py --sanitize"
logger-provision-test = "python tools/test_logger_provision.py --sanitize"
logger-live-test = "python tools/test_logger_live.py --sanitize"
logger-power-test = "python tools/test_logger_power.py --sanitize"
# Destructive: requires the checked port and exact full-backup file.
waveshare-flash = "firmware/esp-idf-waveshare-sim7670g/flash.sh"

# --- host code quality ---
fmt = "rg --files -0 firmware tools -g '*.c' -g '*.h' -g '*.cpp' -g '*.hpp' -g '*.ino' -g '!**/vendor/**' -g '!**/build/**' -g '!**/managed_components/**' | xargs -0 clang-format -i"
fmt-check = "rg --files -0 firmware tools -g '*.c' -g '*.h' -g '*.cpp' -g '*.hpp' -g '*.ino' -g '!**/vendor/**' -g '!**/build/**' -g '!**/managed_components/**' | xargs -0 clang-format --dry-run --Werror"
lint = "bash tools/lint.sh"
# Full host gate, the same entry point CI runs. See tools/gate.sh for the task list.
gate = "bash tools/gate.sh"
archive-sync-test = "python tools/test_archive_sync.py --sanitize"
ble-advert-test = "python tools/test_ble_advert.py --sanitize"
location-test = "python tools/test_location.py --sanitize"
network-time-test = "python tools/test_network_time.py --sanitize"
wifi-link-test = "python tools/test_wifi_link.py --sanitize"
lan-concurrency-bench = "python tools/bench_lan_concurrency.py"
control-sync-test = "python tools/test_control_sync.py --sanitize"
disconnect-test = "python tools/test_disconnect.py --sanitize"
frame-ring-test = "python tools/test_frame_ring.py --sanitize"
ble-policy-test = "python tools/test_ble_policy.py --sanitize"
config-test = "python tools/test_device_config.py --sanitize"
common-test = "python tools/test_common.py --sanitize"
ltr553-test = "python tools/test_ltr553.py --sanitize"
max17048-test = "python tools/test_max17048.py --sanitize"
battery-health-test = "python tools/test_battery_health.py --sanitize"
coredump-report-test = "python tools/test_coredump_report.py --sanitize"
connectivity-build-test = "tools/build_connectivity_fixture.sh"
# Fixture dialect check on crafted compiler databases, and every SDK fixture calls it (#45).
compile-dialect-test = "python tools/test_compile_dialect.py"
# One board built from two checkout paths must produce the same images (#45). Needs the SDK.
repro-paths-check = "bash tools/check_repro_paths.sh"
repro-paths-test = "python tools/test_repro_paths.py"
waveshare-psram-build = "tools/idf.sh -C tools/fixtures/waveshare_psram_probe -B tools/fixtures/waveshare_psram_probe/build build && python tools/check_idf_target.py --compile-dialect tools/fixtures/waveshare_psram_probe/build"
compression-bench = "python tools/benchmark_compression.py"
hooks = "pre-commit install"

[dependencies]
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
ccache = ">=4.14,<5"
python = ">=3.14.7,<3.15"
git = ">=2.55.0,<3"
esptool = "==5.5.0"
rust = ">=1.98.0,<1.99"
# Host fixtures, formatting and lint use these exact pins on macOS and Linux,
# so local runs and CI see the same compiler, sanitizer runtime and diagnostics.
clang-tools = "==23.1.3"
clangxx = "==23.1.3"
compiler-rt = "==23.1.3"
# fmt and fmt-check list sources with rg.
ripgrep = ">=15.2.0,<16"
pip = ">=26.2.1,<27"
pyserial = ">=3.5,<4"
cppcheck = "==2.22.0"
pre-commit = ">=4.6.2,<5"
# Arrow 25.0.1 is current upstream; conda-forge osx-arm64 still offers
# 25.0.0 on 2026-10-10. Keep the validated reader until its patch is packaged.
pyarrow = "==25.0.0"
duckdb = ">=1.5.5,<2"
# GNU timeout bounds each gate task on macOS and Linux alike. It also puts GNU
# stat, date and friends first on PATH, so scripts must stay portable (wc -c,
# not stat -f).
coreutils = ">=9.5,<10"

[activation.env]
# Firmware SDKs are large and are not conda packages, so the project bootstraps
# them itself into one pinned cache that every git worktree shares. Override
# this to relocate them. Nothing here is ever written inside the repo.
AQ_TOOLCHAIN_ROOT = "$HOME/.cache/m5stack-aq-parquet/toolchains"
# Legacy override remains accepted by both trial scripts.
M5_TOOLCHAIN_ROOT = "$HOME/.cache/m5stack-aq-parquet/toolchains"
# macOS system zoneinfo remains valid if a Pixi environment is moved with a
# worktree; Python's compiled default path can still point at its old location.
PYTHONTZPATH = "/usr/share/zoneinfo"

[pypi-dependencies]
bleak = ">=3.0.2, <4"
